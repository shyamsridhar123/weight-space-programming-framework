 <title>A generic task lifecycle</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>A generic task lifecycle</dc:title>
    <dc:description>Generic task lifecycle. A declared task enters a programmer session and branches to an answer candidate, an edit program, or a complete artifact. Edit programs are lowered and projected while retaining the actual endpoint. All three routes join caller checks of structure and required behavior, then validation and declared selection or abstention, sealing the selected identity, held-out evaluation, and a receipt with complete history and independent replay.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Weight-space programming framework flowchart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
