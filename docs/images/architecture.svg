 <title>Framework architecture</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Framework architecture</dc:title>
    <dc:description>Generic framework architecture. A StructuredProgram passes through explicit lowering to a literal Program. The literal Program, TaskSpec with access and budgets, and an answer or complete artifact feed ProgrammerSession. Candidate history proceeds to caller checks and selection, sealing a candidate or abstaining, a caller-owned held-out evaluator, and EvaluationReceipt. Callers must run checks and retain structured proposals and lowering receipts.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Weight-space programming framework flowchart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
