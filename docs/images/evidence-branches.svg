 <title>Three evidence branches</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Three evidence branches</dc:title>
    <dc:description>Three distinct evidence branches. Examples, rules, an optimizer, or an LLM proposal and a named tensor artifact with interface metadata feed a program with exact-parent and cell preconditions. Its candidate artifact branches to a structural policy, an explicit architecture adapter followed by a supported semantic contract, and a caller evaluator with held-out task trials. All branches feed recorded identities and receipts. Evidence from one branch does not substitute for another.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Weight-space programming framework flowchart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
