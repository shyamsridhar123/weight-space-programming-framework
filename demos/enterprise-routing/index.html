<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore a synthetic enterprise policy change using the Weight Space Programming Framework.">
  <title>Enterprise routing · Weight Space Programming</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="identity" href="/" aria-label="Weight Space Programming demo home">Weight Space <strong>Programming</strong></a>
    <span class="scope">Synthetic enterprise demo</span>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <p class="project">Support routing</p>
      <p class="sidebar-note">One policy change.<br>Every obligation visible.</p>
      <nav aria-label="Walkthrough">
        <button data-step="0" aria-current="step">Define the goal</button>
        <button data-step="1">Compare edits</button>
        <button data-step="2">Protect behavior</button>
        <button data-step="3">Make the decision</button>
        <button data-step="4">Understand the impact</button>
        <button data-step="5">Restore the parent</button>
      </nav>
      <div class="scenario-controls">
        <label for="scenario">Explore a scenario</label>
        <select id="scenario">
          <option value="policy-change">Policy change</option>
          <option value="conflict">Conflicting protection</option>
          <option value="coverage-gap">Unseen symptom</option>
        </select>
        <button id="run" class="secondary">Run framework</button>
        <p id="run-status" role="status">Ready to run locally</p>
      </div>
      <a class="evidence-link" id="download" download="routing-evidence.json" hidden>Download full evidence</a>
    </aside>
    <main id="main" tabindex="-1">
      <div id="error" role="alert" hidden></div>
      <article id="view" aria-live="polite"></article>
      <footer class="step-footer">
        <p id="concept"></p>
        <div class="step-actions">
          <button id="back" class="text-button">Back</button>
          <button id="next" class="primary">Compare edits</button>
        </div>
      </footer>
    </main>
  </div>
  <footer class="page-footer">A generic framework, applied to one use case. Structured fields and a supplied linear head; no customer data or external model provider.</footer>
</body>
</html>
